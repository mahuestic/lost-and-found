<!DOCTYPE html>
<html>
<head>
    <title>Lost & Found - Find What's Lost</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 50px 40px;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .nav {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }
        
        .nav a {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            text-decoration: none;
            color: #333;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .nav a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .nav a.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            color: #999;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            background: #f9f9f9;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        #message {
            margin-top: 25px;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            display: none;
            font-weight: 600;
            animation: slideDown 0.4s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        #message.success {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #2d6a4f;
            display: block;
        }
        
        #message.error {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/" class="active">📤 Upload</a>
            <a href="/search">🔍 Search</a>
        </div>
        
        <div class="header">
            <div class="emoji">📱</div>
            <h1>Found Something?</h1>
            <p class="subtitle">Help return lost items to their owners</p>
        </div>
        
        <form id="uploadForm">
            <div class="form-group">
                <label>🏷️ Item Name</label>
                <input type="text" placeholder="e.g., Blue Water Bottle" id="itemName" required>
            </div>
            
            <div class="form-group">
                <label>📝 Description</label>
                <textarea placeholder="Describe the item in detail..." id="description"></textarea>
            </div>
            
            <div class="form-group">
                <label>📸 Photo</label>
                <input type="file" id="photo" accept="image/*" required>
            </div>
            
            <div class="form-group">
                <label>👤 Your Name</label>
                <input type="text" placeholder="Enter your full name" id="finderName" required>
            </div>
            
            <div class="form-group">
                <label>📞 Contact Info</label>
                <input type="text" placeholder="Phone or Email" id="finderContact" required>
            </div>
            
            <button type="submit">✨ Upload Item</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('item_name', document.getElementById('itemName').value);
            formData.append('photo', document.getElementById('photo').files[0]);
            formData.append('finder_name', document.getElementById('finderName').value);
            formData.append('finder_contact', document.getElementById('finderContact').value);
            
            const response = await fetch('/upload-found', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            const messageDiv = document.getElementById('message');
            
            if (data.success) {
                messageDiv.textContent = '✅ ' + data.success;
                messageDiv.className = 'success';
                document.getElementById('uploadForm').reset();
            } else {
                messageDiv.textContent = '❌ ' + data.error;
                messageDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
