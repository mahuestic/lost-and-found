<!DOCTYPE html>
<html>
<head>
    <title>Lost & Found - Find What's Lost</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 50px 40px;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .nav {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }
        
        .nav a {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            text-decoration: none;
            color: #333;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .nav a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .nav a.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            color: #999;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            background: #f9f9f9;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        #results {
            margin-top: 30px;
        }
        
        h2 {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .result {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
            animation: slideIn 0.5s ease-out forwards;
        }
        
        .result:hover {
            transform: translateX(5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .result p {
            margin: 10px 0;
            color: #333;
            font-weight: 500;
        }
        
        .result strong {
            color: #667eea;
        }
        
        .no-match {
            text-align: center;
            color: #999;
            padding: 30px 20px;
            font-size: 18px;
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">📤 Upload</a>
            <a href="/search" class="active">🔍 Search</a>
        </div>
        
        <div class="header">
            <div class="emoji">🔍</div>
            <h1>Search Your Item</h1>
            <p class="subtitle">Upload a photo to find matches</p>
        </div>
        
        <form id="searchForm">
            <div class="form-group">
                <label>📸 Upload Photo of Lost Item</label>
                <input type="file" id="photo" accept="image/*" required>
            </div>
            <button type="submit">🚀 Search Now</button>
        </form>
        
        <div id="results"></div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('photo', document.getElementById('photo').files[0]);
            
            const response = await fetch('/search-item', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            const resultsDiv = document.getElementById('results');
            
            if (data.results && data.results.length > 0) {
                resultsDiv.innerHTML = '<h2>✅ Found Matches!</h2>';
                data.results.forEach((item, index) => {
                    resultsDiv.innerHTML += `
                        <div class="result" style="animation-delay: ${index * 0.1}s">
                            <p><strong>Item Name:</strong> ${item.item_name}</p>
                            <p><strong>Finder Name:</strong> ${item.finder_name}</p>
                            <p><strong>Contact:</strong> ${item.finder_contact}</p>
                        </div>
                    `;
                });
            } else {
                resultsDiv.innerHTML = '<div class="no-match">😢 No matches found yet. Keep looking!</div>';
            }
        });
    </script>
</body>
</html>
